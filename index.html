<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Theo dõi lịch thi đấu, kết quả và bảng xếp hạng FIFA World Cup 2026™" />
  <meta name="theme-color" content="#7FAE6E" />
  <title>WC 2026 Tracker</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <!-- CSS -->
  <link rel="stylesheet" href="./assets/css/tokens.css" />
  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./assets/css/layout.css" />
  <link rel="stylesheet" href="./assets/css/components.css" />
  <link rel="stylesheet" href="./assets/css/easter-eggs.css" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='28'>⚽</text></svg>" />
</head>
<body>
<div id="app">

  <!-- Skip link -->
  <a class="sr-only" href="#view">Chuyển đến nội dung chính</a>

  <!-- Phase banner -->
  <div id="phase-banner" class="phase-banner" style="display:none" aria-live="polite"></div>

  <!-- ══ HEADER ═══════════════════════════════════════════════ -->
  <header class="site-header" role="banner">
    <div class="header-inner">

      <!-- Logo -->
      <a href="#home" data-route="home" class="site-logo" aria-label="WC 2026 Tracker — Trang chủ">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
          <circle cx="14" cy="14" r="13" fill="#7FAE6E"/>
          <circle cx="14" cy="14" r="9.5" fill="none" stroke="white" stroke-width="1.5"/>
          <!-- Simplified football stitch pattern -->
          <polygon points="14,6.5 16,11.5 21.5,11.5 17,15 19,20 14,16.5 9,20 11,15 6.5,11.5 12,11.5"
                   fill="white" opacity="0.95"/>
        </svg>
        WC 2026
      </a>

      <!-- Desktop nav -->
      <nav class="main-nav" role="navigation" aria-label="Điều hướng chính">
        <a href="#home"      data-route="home"      class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          Trang chủ
        </a>
        <a href="#schedule"  data-route="schedule"  class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          Lịch thi đấu
        </a>
        <a href="#results"   data-route="results"   class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          Kết quả
        </a>
        <a href="#standings" data-route="standings" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/>
            <line x1="8" y1="18" x2="21" y2="18"/>
            <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/>
            <line x1="3" y1="18" x2="3.01" y2="18"/>
          </svg>
          BXH
        </a>
        <a href="#bracket"   data-route="bracket"   class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
          </svg>
          Playoff
        </a>
      </nav>

      <!-- Header actions -->
      <div class="header-actions">
        <span id="last-updated" class="last-updated" aria-live="polite"></span>
        <button class="btn-icon" data-theme-toggle aria-label="Đổi giao diện">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ══ MAIN VIEW ═════════════════════════════════════════════ -->
  <main id="view" class="site-main" role="main" aria-label="Nội dung chính">
    <!-- Initial skeleton -->
    <div class="container section">
      <div style="display:flex;flex-direction:column;gap:var(--sp-4)">
        <div class="match-card-skeleton">
          <div class="skel-row" style="gap:8px">
            <div class="skeleton skel-box" style="width:80px;height:13px"></div>
            <div class="skeleton skel-box" style="width:55px;height:13px;margin-left:auto"></div>
          </div>
          <div class="skel-row" style="justify-content:space-between;align-items:center;margin-top:10px;gap:8px">
            <div class="skeleton skel-box" style="width:110px;height:22px"></div>
            <div class="skeleton skel-box" style="width:65px;height:36px"></div>
            <div class="skeleton skel-box" style="width:110px;height:22px"></div>
          </div>
          <div class="skeleton skel-box" style="width:100%;height:12px;margin-top:10px"></div>
        </div>
        <div class="match-card-skeleton">
          <div class="skel-row" style="gap:8px">
            <div class="skeleton skel-box" style="width:70px;height:13px"></div>
            <div class="skeleton skel-box" style="width:50px;height:13px;margin-left:auto"></div>
          </div>
          <div class="skel-row" style="justify-content:space-between;align-items:center;margin-top:10px;gap:8px">
            <div class="skeleton skel-box" style="width:100px;height:22px"></div>
            <div class="skeleton skel-box" style="width:65px;height:36px"></div>
            <div class="skeleton skel-box" style="width:120px;height:22px"></div>
          </div>
          <div class="skeleton skel-box" style="width:90%;height:12px;margin-top:10px"></div>
        </div>
        <div class="match-card-skeleton">
          <div class="skel-row" style="gap:8px">
            <div class="skeleton skel-box" style="width:90px;height:13px"></div>
            <div class="skeleton skel-box" style="width:45px;height:13px;margin-left:auto"></div>
          </div>
          <div class="skel-row" style="justify-content:space-between;align-items:center;margin-top:10px;gap:8px">
            <div class="skeleton skel-box" style="width:115px;height:22px"></div>
            <div class="skeleton skel-box" style="width:65px;height:36px"></div>
            <div class="skeleton skel-box" style="width:95px;height:22px"></div>
          </div>
          <div class="skeleton skel-box" style="width:95%;height:12px;margin-top:10px"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- ══ MOBILE BOTTOM NAV ═════════════════════════════════════ -->
  <nav class="mobile-nav" role="navigation" aria-label="Điều hướng di động">
    <div class="mobile-nav-inner">
      <a href="#home"      data-route="home"      class="mobile-nav-link" aria-label="Trang chủ">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Home
      </a>
      <a href="#schedule"  data-route="schedule"  class="mobile-nav-link" aria-label="Lịch thi đấu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        Lịch
      </a>
      <a href="#results"   data-route="results"   class="mobile-nav-link" aria-label="Kết quả">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        Kết quả
      </a>
      <a href="#standings" data-route="standings" class="mobile-nav-link" aria-label="Bảng xếp hạng">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
          <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
        </svg>
        BXH
      </a>
      <a href="#bracket"   data-route="bracket"   class="mobile-nav-link" aria-label="Playoff">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        Playoff
      </a>
    </div>
  </nav>

  <!-- ══ FOOTER ════════════════════════════════════════════════ -->
  <footer class="site-footer" role="contentinfo">
    <p>WC 2026 Tracker &middot; Dữ liệu từ
      <a href="https://github.com/openfootball/worldcup.json" target="_blank" rel="noopener noreferrer"
         style="color:var(--c-matcha);font-weight:700">openfootball</a>
    </p>
    <p style="margin-top:var(--sp-1)">Không liên kết chính thức với FIFA™</p>
  </footer>

  <!-- Toast container -->
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

</div><!-- /#app -->

  <!-- JS entry — ES modules, no build step needed -->
  <script type="module" src="./assets/js/app.js"></script>
  <!-- Twemoji: flag emoji ONLY -->
  <script src="https://cdn.jsdelivr.net/npm/@twemoji/api@latest/dist/twemoji.min.js" crossorigin="anonymous"></script>
  <script src="./assets/js/twemoji-flags.js" defer></script>
</body>
</html>
